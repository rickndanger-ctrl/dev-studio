name: test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  macos-bash-3-2:
    # The real target: macOS ships bash 3.2 at /bin/bash, and the Dock app runs under it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put the system bash 3.2 first on PATH
        run: |
          echo "/bin" >> "$GITHUB_PATH"
          /bin/bash --version | head -1
      - name: Parse every script with bash 3.2
        run: |
          # Every tracked file with a bash shebang, so renamed or new scripts are always covered.
          for f in $(git ls-files | xargs grep -lE '^#!.*bash|^# shellcheck shell=bash' --); do
            /bin/bash -n "$f" && echo "ok $f"
          done
      - name: Python files compile
        run: python3 -m py_compile $(git ls-files '*.py')
      - name: End-to-end tests under bash 3.2
        run: PATH="/bin:$PATH" /bin/bash test/run.sh
      - name: AppleScript project picker compiles
        run: osacompile -o /tmp/pick.scpt macos/pick-project.applescript

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck $(git ls-files | xargs grep -lE '^#!.*bash|^# shellcheck shell=bash' --)
